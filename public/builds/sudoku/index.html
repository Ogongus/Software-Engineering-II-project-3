
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Game - Group 2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f6fa;
            padding: 20px;
        }

        h1 {
            color: #253858;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(9, 40px);
            justify-content: center;
            margin: 20px auto;
        }

        #board input {
            width: 38px;
            height: 38px;
            text-align: center;
            font-size: 20px;
            border: 1px solid #999;
            box-sizing: border-box;
        }

        #board input:nth-child(3n) {
            border-right: 2px solid #333;
        }

        .fixed {
            background: #dce5f2;
            font-weight: bold;
        }

        button, select {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
        }

        #message {
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h1>Sudoku Game</h1>
    <p>EECS 581 - Software Engineering II | Group 2</p>

    <label for="difficulty">Difficulty:</label>
    <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
    </select>

    <button id="new-game">New Game</button>

    <div id="board"></div>

    <button id="check-answer">Check Answer</button>
    <p id="message" aria-live="polite"></p>

    <a href="/catalog.html" target="_top">Back to Game Catalog</a>

    <script src="sudoku.js"></script>
</body>
</html>
